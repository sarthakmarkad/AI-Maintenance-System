services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: maintenance_owner
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
      POSTGRES_DB: maintenance
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - maintenance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance_owner -d maintenance"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  maintenance_pg:
